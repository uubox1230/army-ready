<body class="community-page">
  <header class="community-header">
    <div class="community-header-inner">
      <a class="community-back global-back-link" href="index.html" aria-label="返回首頁">
        <span class="global-back-icon" aria-hidden="true">‹</span>
        <span class="global-back-label">返回首頁</span>
      </a>

    </div>
  </header>

  <main class="community-main">
    <section class="community-hero page-intro">
      <div class="page-intro-row">
        <div class="page-intro-copy">
          <p class="community-eyebrow page-intro-eyebrow">ARMY FAN PROJECTS</p>
          <h2 class="page-intro-title">粉絲應援活動</h2>
          <p class="page-intro-description">
            整理免費應援發放、拍照打卡與其他非官方活動。
            請依各主辦單位最新公告與現場規定參加。
          </p>
        </div>

        <button
          id="communityFavoriteToggle"
          class="community-favorite-toggle page-intro-action"
          type="button"
          aria-pressed="false"
        >
          <span aria-hidden="true">♡</span>
          <span>我的收藏</span>
        </button>
      </div>
    </section>

    <section class="community-toolbar" aria-label="活動篩選">
      <div id="communityFilters" class="community-filters"></div>

      <label class="community-search">
        <span class="sr-only">搜尋活動</span>
        <input
          id="communitySearch"
          type="search"
          placeholder="搜尋活動、地點或主辦單位"
          autocomplete="off"
        >
      </label>
    </section>

    <section class="community-status">
      <p id="communityResultCount">0 個活動</p>
      <button id="communityReset" type="button">清除篩選</button>
    </section>

    <section
      id="communityList"
      class="community-list"
      aria-live="polite"
    ></section>

    <section id="communityEmpty" class="community-empty hidden">
      <strong>沒有符合條件的活動</strong>
      <p>請更換分類、日期或搜尋關鍵字。</p>
    </section>
  </main>

  <script src="js/community/data.js"></script>
  <script src="js/community/page.js"></script>
  <script src="js/system/navigation-menu.js"></script>
