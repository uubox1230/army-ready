<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Lyrics Data Editor v2.2｜ARMY READY</title>
  <link rel="stylesheet" href="editor.css">
</head>

<body>
  <header class="editor-header">
    <div>
      <p>ARMY READY TOOLS</p>
      <h1>Lyrics Data Editor <span>v2.2</span></h1>
    </div>
    <a href="../song.html#hooligan" target="_blank" rel="noopener">開啟 Song Page ↗</a>
  </header>

  <main class="editor-shell">
    <aside class="editor-sidebar">
      <section class="editor-panel">
        <label for="songSelect">選擇歌曲</label>
        <select id="songSelect"></select>

        <div class="editor-progress-copy">
          <span>韓文輔助資料完成度</span>
          <strong id="progressText">0 / 0</strong>
        </div>
        <div class="editor-progress" aria-hidden="true">
          <span id="progressFill"></span>
        </div>
      </section>

      <section class="editor-panel editor-filters">
        <label class="editor-checkbox">
          <input id="incompleteOnly" type="checkbox">
          <span>只顯示待補行</span>
        </label>

        <label for="lineSearch">搜尋歌詞</label>
        <input id="lineSearch" type="search" placeholder="搜尋韓文、Roman 或空耳">
      </section>

      <section class="editor-panel editor-guide">
        <h2>填寫規則</h2>
        <ul>
          <li>韓文原文只讀，不在此修改。</li>
          <li>Roman 使用容易跟唱的拼法。</li>
          <li>中文空耳記錄發音，不是語意翻譯。</li>
          <li>英文行可保留原文，不列入缺漏。</li>
          <li>「改喊」行請勿破壞原有內容。</li>
        </ul>
      </section>

      <section class="editor-actions">
        <button id="reloadDataButton" class="secondary" type="button">重新讀取專案歌曲</button>
        <button id="copyButton" class="secondary" type="button">複製完整 JS</button>
        <button id="downloadButton" class="primary" type="button">下載目前歌曲 JS</button>
        <button id="resetButton" class="danger" type="button">捨棄本曲草稿</button>
        <p id="saveStatus" aria-live="polite">尚未修改</p>
      </section>
    </aside>

    <section class="editor-workspace">
      <div class="editor-song-heading">
        <div>
          <p id="songFileLabel">—</p>
          <h2 id="songTitle">請選擇歌曲</h2>
        </div>
        <div class="editor-legend" aria-label="預覽圖例">
          <span class="korean">韓文</span>
          <span class="roman">Roman</span>
          <span class="practice">空耳</span>
        </div>
      </div>

      <div id="emptyState" class="editor-empty hidden">
        <strong>目前沒有符合條件的歌詞行</strong>
        <p>請清除搜尋或關閉「只顯示待補行」。</p>
      </div>

      <div id="lineList" class="editor-line-list"></div>
    </section>
  </main>

  <div id="toast" class="editor-toast" role="status" aria-live="polite"></div>

  <script src="editor-loader.js"></script>
</body>
</html>
